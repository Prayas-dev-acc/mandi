name: Daily Garlic Intelligence Update

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download latest database
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --pattern "garlic.duckdb" --output garlic.duckdb \
            && echo "DB downloaded ($(du -sh garlic.duckdb | cut -f1))" \
            || echo "No previous release found — starting fresh"

      - name: Run daily pipeline
        env:
          CI: "true"
        run: python pipeline.py --ci

      - name: Upload updated database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="db-$(date +%Y%m%d)"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" garlic.duckdb \
            --title "Database $TAG" \
            --notes "Auto-updated by daily pipeline" \
            --latest

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add report.html accuracy_log.csv accuracy_summary.json \
                  price_forecast.csv weather_monthly.csv || true
          git diff --cached --quiet \
            || git commit -m "Auto-update $(date +%Y-%m-%d)"
          git push
